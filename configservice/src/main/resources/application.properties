spring.application.name=configservice
server.port=8888

spring.cloud.config.server.git.uri=${CONFIG_GIT_URI}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:main}
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME:}
spring.cloud.config.server.git.password=${CONFIG_GIT_TOKEN:}
spring.cloud.config.server.git.clone-on-start=true

eureka.client.service-url.defaultZone=http://discoveryservice:8761/eureka/
