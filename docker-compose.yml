services:
  mysqldb:
    image: mysql:8.0
    container_name: mysqldb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - msa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  discoveryservice:
    build: ./discoveryservice
    container_name: discoveryservice
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - msa-network

  configservice:
    build:
      context: ./configservice
      dockerfile: Dockerfile
    container_name: configservice
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      CONFIG_GIT_URI: ${CONFIG_GIT_URI}
      CONFIG_GIT_LABEL: ${CONFIG_GIT_LABEL:-main}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME:-}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryservice:8761/eureka/
    networks:
      - msa-network
    depends_on:
      discoveryservice:
        condition: service_started

  userservice:
    build: ./userservice
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryservice:8761/eureka/
    depends_on:
      mysqldb:
        condition: service_healthy
      discoveryservice:
        condition: service_started
      configservice:
        condition: service_started
    networks:
      - msa-network

  orderservice:
    build: ./orderservice
    restart: unless-stopped
    ports:
      - "8082-8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryservice:8761/eureka/
    depends_on:
      mysqldb:
        condition: service_healthy
      discoveryservice:
        condition: service_started
      configservice:
        condition: service_started
    networks:
      - msa-network

  apigateway:
    build: ./apigateway
    container_name: apigateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discoveryservice:8761/eureka/
    depends_on:
      discoveryservice:
        condition: service_started
    networks:
      - msa-network

networks:
  msa-network:
    driver: bridge
